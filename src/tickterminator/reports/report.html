<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TickTerminator report</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 1100px; color: #1f2328; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .summary { color: #59636e; margin: 0 0 16px; }
  #map { height: 480px; border-radius: 8px; margin-bottom: 24px; }
  #map[hidden] { display: none; }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #d1d9e0; vertical-align: middle; }
  td img { width: 120px; border-radius: 4px; display: block; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .popup img { width: 200px; display: block; margin-top: 6px; border-radius: 4px; }
  .sector-label { background: transparent; border: none; box-shadow: none; font-weight: 700; color: #fff; text-shadow: 0 0 3px #000; }
</style>
</head>
<body>
<h1>TickTerminator report</h1>
<p class="summary">$summary. Check each finding before you act on it.</p>
<div id="map" hidden></div>
<div class="table-scroll">
<table>
  <thead><tr><th>Photo detail</th><th>Pest</th><th>Score</th><th>Sector</th><th>Image</th><th>Position</th></tr></thead>
  <tbody>
$table_rows
  </tbody>
</table>
</div>
<script>
  const data = $map_data;
  if (data.findings.length && window.L) {
    const mapElement = document.getElementById("map");
    mapElement.hidden = false;
    const map = L.map(mapElement);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    for (const sector of data.sectors) {
      L.rectangle(sector.bounds, { color: "#ffffff", weight: 1, fillOpacity: 0.05 })
        .bindTooltip(sector.label, { permanent: true, direction: "center", className: "sector-label" })
        .addTo(map);
    }

    const markers = data.findings.map((finding) => {
      const popup = document.createElement("div");
      popup.className = "popup";
      popup.append(
        finding.pest + " (" + finding.score.toFixed(2) + ")",
        document.createElement("br"),
        "Sector " + (finding.sector || "–") + " · " + finding.image,
      );
      const image = document.createElement("img");
      image.src = finding.thumbnail;
      popup.append(image);
      return L.circleMarker([finding.latitude, finding.longitude], {
        radius: 8, color: "#ffffff", weight: 2, fillColor: finding.color, fillOpacity: 0.9,
      }).bindPopup(popup);
    });
    map.fitBounds(L.featureGroup(markers).addTo(map).getBounds().pad(0.2), { maxZoom: 19 });
  }
</script>
</body>
</html>
